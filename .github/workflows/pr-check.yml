name: PR Check (Kitap Denetimi)

# TEST DALI SÜRÜMÜ: kod main'den değil feat/library-sync'ten alınır, LIBRARY_SYNC sabit "1".
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Kitap Bütünlük Kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.head_ref, 'book/')
    env:
      LIBRARY_SYNC: "1"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use scripts from feat/library-sync (TEST)
        run: |
          git fetch origin feat/library-sync
          mkdir -p "$RUNNER_TEMP/main-code"
          git archive FETCH_HEAD scripts requirements.txt | tar -x -C "$RUNNER_TEMP/main-code"
          echo "MAIN_CODE=$RUNNER_TEMP/main-code" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "$MAIN_CODE/requirements.txt"

      - name: Pull chapters from library
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$MAIN_CODE/scripts/library_pull.py"

      - name: Extract book slug
        id: slug
        run: echo "slug=${GITHUB_HEAD_REF#book/}" >> "$GITHUB_OUTPUT"

      - name: Run PR check
        env:
          PYTHONUNBUFFERED: "1"
        run: python "$MAIN_CODE/scripts/pr_check.py" "${{ steps.slug.outputs.slug }}"
