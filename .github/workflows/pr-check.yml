name: PR Check (Kitap Denetimi)

# Bir book/<slug> dalı main'e "tamamlandı" PR'ı açtığında (convert.py bunu
# otomatik yapıyor) ya da o PR'a yeni commit geldiğinde otomatik çalışır.
# Amaç: bu projede canlıda gerçekten yaşanmış hata sınıflarının (kayıp
# bölüm, İngilizce kalmış başlık, kalıntı İngilizce kelime — bkz.
# scripts/pr_check.py) hiçbirinin fark edilmeden main'e girmemesi.
#
# NOT: Bu check PR'da kırmızı/yeşil olarak görünür ama merge'i FİZİKSEL
# OLARAK engellemez — sert bir engel istenirse repo Settings > Branches
# > main için bir branch protection rule eklenip bu check "required"
# olarak işaretlenmeli (job adı: "Kitap Bütünlük Kontrolü").
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Kitap Bütünlük Kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.head_ref, 'book/')

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Kod HER ZAMAN main'den gelir; dal sadece veri (status.json, output/ ...)
      # tasir. Aksi halde dal acildigi andaki eski script'lerle calisir, main'e
      # giren duzeltmeler acik kitaplara ulasmaz (ve bir PR'in kendi pr_check.py'sini
      # degistirerek kontrolu zayiflatmasi mumkun olur).
      - name: Use scripts from main
        run: |
          git fetch origin main
          mkdir -p "$RUNNER_TEMP/main-code"
          git archive FETCH_HEAD scripts requirements.txt | tar -x -C "$RUNNER_TEMP/main-code"
          echo "MAIN_CODE=$RUNNER_TEMP/main-code" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "$MAIN_CODE/requirements.txt"

      - name: Extract book slug
        id: slug
        run: echo "slug=${GITHUB_HEAD_REF#book/}" >> "$GITHUB_OUTPUT"

      - name: Run PR check
        env:
          PYTHONUNBUFFERED: "1"
        run: python "$MAIN_CODE/scripts/pr_check.py" "${{ steps.slug.outputs.slug }}"
