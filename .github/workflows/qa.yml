name: QA Audit (Gemini)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Denetlenecek kitap dalı (örn. book/knh-11)"
        required: true
        type: string
      slug:
        description: "Kitap slug'ı (örn. knh-11)"
        required: true
        type: string
      max_chapters:
        description: "Test için ilk N bölümle sınırla (boş = tümü)"
        required: false
        type: string
      run_series_suggest:
        description: "Kitap bitince seri glossary'sine öneri de üretilsin mi?"
        required: false
        type: boolean
        default: true
      apply_fixes:
        description: "Denetim bitince, somut olarak eşleştirilen hataları Qwen'e (Groq) düzelttir mi?"
        required: false
        type: boolean
        default: false
      skip_audit:
        description: "Yeniden taramadan, dalda ZATEN VAR olan qa_report.md'yi kullanarak sadece düzeltme/öneri adımlarını çalıştır"
        required: false
        type: boolean
        default: false

# NOT (Eylül 2026): Eskiden bu workflow ana çeviri hattından (translate.yml/
# queue-worker.yml/review.yml) BİLEREK ayrı tutulur, sadece elle
# (workflow_dispatch) tetiklenirdi — gerekçe: Gemini'nin ücretsiz katmanı
# Groq'a göre çok daha kısıtlı (RPM/RPD), otomatik bir güvenlik ağına
# bağlamanın kotayı gereksiz yere hızla tüketeceği düşünülmüştü.
# Artık review.yml bitince BU workflow'u kendisi tetikliyor (bkz.
# review.py) VE translate.yml'in periyodik güvenlik ağı da status.json'daki
# qa_status alanına bakıp "review bitti ama QA bitmedi" durumunu görünce
# bunu dürtüyor — bu ikinci kısım tam olarak istenen şeyi çözüyor: Gemini
# günlük kotası tükenip iş yarım kalırsa (qa_audit.py zaten checkpoint'li,
# .qa_progress.json ile kaldığı yerden devam ediyor), bir sonraki periyodik
# tetiklemede (kota sıfırlandıktan sonra) otomatik devam eder — elle
# tekrar tetiklemeye gerek kalmaz. Gemini kotası ENDİŞESİ hâlâ geçerli
# ama artık checkpoint'li devam ettiği için tekrar denemeler ucuz (zaten
# denetlenmiş bölümleri yeniden taramıyor).
jobs:
  qa-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      # Periyodik güvenlik ağının (translate.py:_scan_and_nudge_active_books)
      # "QA bitmedi mi, o zaman dürt" diye tekrar tekrar boşu boşuna
      # tetiklememesi için, bu işin BAŞLADIĞINI hemen işaretliyoruz. is_stale
      # kontrolü (diğer *_status alanlarıyla aynı desen) güvenlik ağının,
      # gerçekten çakılmış bir run'ı normal çalışan bir run'dan ayırt
      # etmesini sağlıyor.
      - name: Mark QA running
        run: |
          python3 -c "
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from lib.git_utils import write_status
          status = json.load(open('status.json', encoding='utf-8')) if os.path.exists('status.json') else {}
          status['qa_status'] = 'running'
          write_status(status, 'qa: başladı')
          "

      # series/<slug>.json genelde main'de yaşıyor (bkz. lib/series.py) —
      # bu dal onu içermiyorsa, öneri script'inin "zaten var olan" bağlamı
      # görebilmesi için main'den bir kopyasını çekmeyi dene. Yoksa (henüz
      # bu seri için glossary yazılmadıysa) sorun değil, script boş
      # sözlükle devam eder.
      #
      # NOT (Ağustos 2026, gerçek üretim hatası): Burada eskiden
      # `${{ inputs.slug }}` (KİTAP slug'ı, örn. "knh-11") kullanılıyordu —
      # ama series dosyaları KİTABIN değil SERİNİN adıyla ("kusuriya")
      # adlandırılıyor (bkz. status.json'daki "series" alanı). Bu yüzden
      # main'deki GEÇERLİ series/kusuriya.json hiç çekilmiyordu, dalda
      # zaten var olan (ve bir noktada elle düzenlenirken virgülü unutulup
      # BOZULMUŞ) eski kopya kullanılmaya devam ediyordu — series_suggest.py
      # "series/kusuriya.json okunamadı" diye sessizce göz ardı ediyordu.
      # Artık status.json'dan GERÇEK seri slug'ını okuyup onu kullanıyoruz.
      - name: Determine series slug
        id: series
        run: |
          SERIES=$(python3 -c "import json, os; print((json.load(open('status.json', encoding='utf-8')).get('series') or '') if os.path.exists('status.json') else '')" 2>/dev/null || echo "")
          echo "slug=$SERIES" >> "$GITHUB_OUTPUT"

      - name: Pull existing series glossary from main (best-effort)
        if: inputs.run_series_suggest == true && steps.series.outputs.slug != ''
        run: |
          mkdir -p series
          git show origin/main:series/${{ steps.series.outputs.slug }}.json > /tmp/existing_series.json 2>/dev/null \
            && cp /tmp/existing_series.json series/${{ steps.series.outputs.slug }}.json \
            && echo "Mevcut glossary main'den çekildi (series/${{ steps.series.outputs.slug }}.json)." \
            || echo "Bu seri için main'de henüz bir glossary yok, boş başlanıyor."

      - name: Run QA audit
        if: inputs.skip_audit != true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Python'un stdout'u CI ortamında (gerçek terminal olmadığı için)
          # varsayılan olarak buffer'lanıyor — print() çağrıları anında değil,
          # buffer dolunca ya da script bitince log'a düşüyor. Gemini'nin
          # ücretsiz katmanı yavaş/rate-limit'li olduğu için her bölüm
          # arasında uzun sessizlikler oluyor ve bu "job takılmış gibi"
          # görünmesine yol açıyordu — script aslında çalışıyordu, sadece
          # log gecikmeliydi.
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ inputs.max_chapters }}" ]; then
            python scripts/qa_audit.py "${{ inputs.slug }}" --max-chapters "${{ inputs.max_chapters }}"
          else
            python scripts/qa_audit.py "${{ inputs.slug }}"
          fi

      # qa_audit.py, günlük/anlık kota yüzünden yarım kalırsa BİLE 0 (başarılı)
      # ile çıkıyor — "KISMİ RAPOR" yazıp checkpoint'i (.qa_progress.json)
      # KORUYOR ki bir sonraki çalıştırma kaldığı yerden devam edebilsin.
      # Denetim GERÇEKTEN tamamlandığında ise bu checkpoint dosyası SİLİNİYOR
      # (bkz. qa_audit.py). Yani "tam mı kısmi mi tamamlandı" sorusunun
      # cevabı, bu dosyanın hâlâ var olup olmadığında — Actions log'undaki
      # "KISMİ RAPOR" metnini aramaktan daha güvenilir bir sinyal.
      - name: Check QA completion
        id: qacheck
        if: always()
        run: |
          if [ -f "output/${{ inputs.slug }}/.qa_progress.json" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Denetim KISMİ tamamlandı (checkpoint hâlâ duruyor) — muhtemelen Gemini günlük kotası doldu."
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Denetim TAM tamamlandı (checkpoint temizlendi)."
          fi

      # Gemini'nin somut olarak (kaynak+hatalı çeviri alıntısı çiftiyle)
      # işaretlediği maddeleri Qwen'e (Groq) tek tek düzelttirir — bkz.
      # apply_qa_fixes.py docstring'i: SADECE alıntı dosyada birebir
      # bulunursa uygulanır, tahminle hiçbir yere yapıştırma yapılmaz.
      # Varsayılan olarak KAPALI (apply_fixes: false) — ilk birkaç
      # kitapta admin'in --dry-run ile önce kendi gözüyle kontrol etmesi
      # öneriliyor.
      - name: Apply QA fixes (Qwen)
        if: inputs.apply_fixes == true
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/apply_qa_fixes.py "${{ inputs.slug }}"

      - name: Run series suggestion
        if: inputs.run_series_suggest == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/series_suggest.py "${{ inputs.slug }}"

      - name: Commit results
        if: always()
        run: |
          # NOT (Ağustos 2026, gerçek üretim hatası): `git add A B C` çağrısı,
          # üçünden BİRİ bile diskte yoksa (örn. denetim TAM tamamlanıp
          # .qa_progress.json checkpoint'i silindiğinde — bu aslında BAŞARI
          # durumu!) TÜM komutu sessizce başarısız kılıyor, mevcut olan
          # diğer dosyaları (qa_report.md gibi) BİLE stage etmiyordu. Gerçek
          # üretimde tam da bu oldu: denetim 27/27 bölümü başarıyla bitirdi,
          # rapor diskte vardı, ama commit adımı "Değişiklik yok" deyip hiç
          # commit atmadı — checkpoint temizlendiği için "başarı" sessizce
          # "hiçbir şey yapılmadı" gibi göründü. Artık her dosyayı AYRI
          # `git add` çağrısıyla ekliyoruz — biri yoksa diğerleri etkilenmiyor.
          git add output/${{ inputs.slug }}/qa_report.md 2>/dev/null || true
          git add output/${{ inputs.slug }}/.qa_progress.json 2>/dev/null || true
          git add output/${{ inputs.slug }}/*.txt 2>/dev/null || true
          git add series/*.suggested.json 2>/dev/null || true
          git diff --cached --quiet && echo "Değişiklik yok." && exit 0
          git commit -m "qa: ${{ inputs.slug }} denetim raporu + seri önerisi"
          git push origin HEAD:${{ inputs.branch }}

      # NOT (Eylül 2026): qa_status'u burada, HER durumda (always()) ama
      # Check QA completion adımının sonucuna göre FARKLI değerle
      # işaretliyoruz:
      #  - complete=true  -> "completed" + convert.yml tetiklenir (epub artık
      #    QA düzeltmeleri UYGULANMIŞ haliyle ciltlenir)
      #  - complete=false -> "partial" (ASLA "completed" değil) — böylece
      #    translate.py'nin periyodik güvenlik ağı bunu "hâlâ bitmedi" diye
      #    görüp bir sonraki taramasında qa.yml'i TEKRAR tetikler; kaldığı
      #    yerden (checkpoint sayesinde) devam eder. Gemini günlük kotası
      #    doluysa, bu doğal olarak "ertesi gün otomatik devam etme" etkisini
      #    verir — periyodik tarama zaten saatlik/günlük aralıklarla çalışıyor.
      - name: Mark QA status & trigger next step
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 -c "
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from lib.git_utils import write_status
          status = json.load(open('status.json', encoding='utf-8')) if os.path.exists('status.json') else {}
          status['qa_status'] = '${{ steps.qacheck.outputs.complete == 'true' && 'completed' || 'partial' }}'
          write_status(status, 'qa: ${{ steps.qacheck.outputs.complete == 'true' && 'tamamlandı' || 'kısmi, devam edecek' }}')
          "
          if [ "${{ steps.qacheck.outputs.complete }}" = "true" ]; then
            gh workflow run convert.yml -f branch="${{ inputs.branch }}"
          else
            echo "QA kısmi kaldı — convert tetiklenmedi. Periyodik güvenlik ağı bir sonraki taramada qa.yml'i tekrar tetikleyecek."
          fi
