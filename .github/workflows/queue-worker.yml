name: Queue Worker

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "İşlenecek kitap dalı (örn. book/pg2147)"
        required: true
        type: string

# Sadece AYNI KİTABIN kendi türünden (başka bir queue-worker run'ı) ile
# çakışmayı önler — grup adına dal adını dahil ederek her kitap kendi
# bağımsız kuyruğunda ilerliyor, biri diğerini kuyruktan atamıyor.
concurrency:
  group: eptran-queue-worker-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    # Her run TEK BİR parça çeviriyor — normalde birkaç dakika sürer.
    # Yine de NER/hafıza çıkarımı + birkaç retry ihtimaline karşı
    # makul bir pay bırakıyoruz. Eskiden bir run bir KİTABIN TAMAMINI (360 dk'ya
    # kadar) işlemeye çalışıyordu; artık kaybedilebilecek en fazla şey
    # tek bir parçanın o anki denemesi.
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # TEST DALI (test/library-sync-e2e): token eptran-library'ye de yazabilmeli.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            eptran
            eptran-library

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # TEST DALI: kod main'den DEĞİL, feat/library-sync'ten alınır (henüz main'de
      # olmayan library_sync'i denemek için). Veri dalı yine sadece veri taşır.
      - name: Use scripts from feat/library-sync (TEST)
        run: |
          git fetch origin feat/library-sync
          mkdir -p "$RUNNER_TEMP/main-code"
          git archive FETCH_HEAD scripts requirements.txt | tar -x -C "$RUNNER_TEMP/main-code"
          echo "MAIN_CODE=$RUNNER_TEMP/main-code" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "$MAIN_CODE/requirements.txt"

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Process one queued chunk
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LIBRARY_SYNC: "1"
        run: python "$MAIN_CODE/scripts/queue_worker.py"
