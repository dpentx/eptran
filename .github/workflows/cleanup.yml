name: Cleanup old book output

# Admin aracı: belirtilen kitap slug'larının output/ klasörünü ve
# input/.originals/<slug>.epub yedeğini main'den TAMAMEN siler.
# workflow_dispatch dışında hiçbir otomatik tetikleyici yok — sadece
# elle, açıkça istendiğinde çalışır. M mcp'nin (ve genel olarak GitHub
# Contents API sarmalayıcılarının) push/update yapabilip dosya/klasör
# SİLEMEMESİ yüzünden bu iş, gerçek bir git checkout + commit + push
# yapabilen bu workflow üzerinden yürütülüyor.
#
# NOT (ilk deneme başarısız oldu): main korumalı ("Changes must be
# made through a pull request") — App token'ı bile main'e DOĞRUDAN push
# atamaz. Bu yüzden değişiklik önce ayrı bir dala push'lanıp sonra PR
# açılıyor; PR'ı merge etmek (gerekli ama "book/*" olmayan dallarda hiç
# çalışmayan "Kitap Bütünlük Kontrolü" check'i yüzünden) elle/M mcp
# üzerinden yapılmalı.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Silinecek kitap slug'ları, virgül ile ayrılmış (örn. knh-10,knh-11,pg2147)"
        required: true
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Create branch
        run: git checkout -b "cleanup/${{ github.run_id }}"

      - name: Delete book output and originals
        run: |
          IFS=',' read -ra SLUGS <<< "${{ inputs.slugs }}"
          for raw in "${SLUGS[@]}"; do
            slug=$(echo "$raw" | xargs)
            if [ -z "$slug" ]; then continue; fi
            echo "Siliniyor: $slug"
            git rm -r --ignore-unmatch "output/$slug"
            git rm -f --ignore-unmatch "input/.originals/$slug.epub"
          done

      - name: Commit, push and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --cached --quiet; then
            echo "Silinecek bir şey bulunamadı (slug'lar zaten yok ya da yanlış yazıldı)."
          else
            git commit -m "chore: eski kitap çıktıları silindi (${{ inputs.slugs }})"
            git push origin "cleanup/${{ github.run_id }}"
            gh pr create --base main --head "cleanup/${{ github.run_id }}" \
              --title "chore: eski kitap çıktıları silindi (${{ inputs.slugs }})" \
              --body "cleanup.yml workflow_dispatch ile tetiklendi. Silinen slug'lar: ${{ inputs.slugs }}. Bu PR'ı merge etmek main'in ruleset'i yüzünden elle (ya da M mcp üzerinden) yapılmalı."
          fi
