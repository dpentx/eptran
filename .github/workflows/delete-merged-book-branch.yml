name: Delete merged book branch

# book/<slug> PR'ı KAPANINCA (merge edilsin ya da edilmesin) dalı siler.
# Aksi halde yetim kalan dal, api/upload.js'in "zaten devam eden bir çeviri
# var" kontrolünü (book/ ve queue/ ile başlayan her dalı "aktif" sayıyor)
# sürekli tetikler ve sıradaki kitabın başlamasını engeller.
#   - merge edildiyse: library-promote.yml dal adını olay verisinden
#     okuduğu için dal silinse de etkilenmez.
#   - merge EDILMEDEN kapatıldıysa (çeviri kalitesiz bulunup reddedildi):
#     kitabın main'e ve kütüphaneye girmediği bilinerek dal yine silinir.
#     DİKKAT: dal silinince çeviri dosyaları da gider; saklamak istiyorsan
#     PR'ı kapatmadan önce dalı başka bir yere kopyala.
#
# Dal silindikten sonra SİRADAKİ kitabı da başlatır: yükleme sırasında
# bekleyen queue/* dallarından en eskisi için translate.yml tetiklenir
# (bkz. scripts/start_next_queue.py). Böylece birden fazla kitap "sıraya
# eklenebiliyor" ve biri bitince (ya da reddedilince) diğeri kendiliğinden
# başlıyor.
on:
  pull_request:
    types: [closed]

jobs:
  delete:
    if: startsWith(github.event.pull_request.head.ref, 'book/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"

      # pull_request olaylarında varsayılan checkout PR'ın merge ref'idir
      # (merge sonrası kaybolabilir) — bu yüzden script'i main'den alıyoruz.
      - name: Checkout main
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Start next queued book
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/start_next_queue.py
