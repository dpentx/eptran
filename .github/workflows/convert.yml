name: Convert to EPUB

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "İşlenecek kitap dalı (örn. book/pg2147)"
        required: true
        type: string

# review.yml bittiğinde bu workflow'u dal adıyla açıkça tetikliyor —
# artık kendi workflow_run zincirlemesi yok. Merkezi güvenlik ağı
# translate.yml'de (tüm 'book/*' dallarını tarayıp gerekeni dürtüyor).
concurrency:
  group: eptran-convert-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Check if conversion needed
        id: check
        run: |
          STATUS=$(python3 -c "
          import json, sys
          try:
              with open('status.json') as f:
                  s = json.load(f)
              if (s.get('status') == 'completed'
                      and s.get('review_status') == 'completed'
                      and s.get('convert_status') not in ('running', 'completed')):
                  print('yes')
              else:
                  print('no')
          except:
              print('no')
          ")
          echo "needed=$STATUS" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.check.outputs.needed == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.needed == 'yes'
        run: pip install -r requirements.txt

      - name: Configure git
        if: steps.check.outputs.needed == 'yes'
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run conversion (and open completion PR)
        if: steps.check.outputs.needed == 'yes'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/convert.py
