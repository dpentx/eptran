name: Translate Novel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

# translate/review/convert hepsi aynı git durumunu (status.json, output/)
# okuyup yazıyor. Aynı grubu paylaşarak, biri çalışırken diğerinin
# (ya da kendisinin başka bir tetiklemesinin) aynı anda başlayıp git
# push'larda yarışmasını (ve sessizce commit kaybetmesini) engelliyoruz.
# Sadece kendi türünden (başka bir translate run'ı) ile çakışmayı önler.
# ÖNEMLİ: review/convert ile AYNI grubu kullanmıyoruz — aynı grupta
# kuyruğa girmiş birden fazla çalışma olduğunda GitHub Actions sadece
# EN SON kuyruğa gireni çalıştırıp öncekileri iptal ediyor. Bu yüzden
# translate zaman aşımına uğrayıp bir sonraki denemesi kuyruğa girdiğinde,
# review'ın kuyruğa girmiş bir çalışması onu iptal edip yerine geçebiliyordu
# — çevirinin hiç ilerleyememesinin sebebi buydu. Artık her workflow kendi
# grubunda, birbirini kuyruktan atamıyor. Çapraz güvenlik zaten
# status.json kontrolüyle sağlanıyor (review, translate "completed"
# olmadan gerçek işi yapmıyor).
# cancel-in-progress: false -> yeni tetiklenen çalışma öncekini iptal
# etmez, sırasını bekler.
concurrency:
  group: eptran-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # Bu adım artık ÇEVİRİ YAPMIYOR, sadece bölüp kuyruğa yazıyor (LLM
    # çağrısı yok) — birkaç dakikadan uzun sürmemeli. Asıl çeviri işini
    # queue-worker.yml, tek parça başına ayrı run'larla yapıyor.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # NOT: explicit belirtiyoruz ama zaten GitHub Actions'ın
          # varsayılanıyla aynı — workflow_dispatch API çağrısında hangi
          # ref (dal) gönderildiyse checkout onu kullanır. Vercel artık
          # bu workflow'u main değil queue/<slug> ref'iyle tetikliyor
          # (bkz. api/upload.js) — bu satır, o davranışın gizli bir
          # varsayıma değil, açık bir tercihe dayandığını belli etsin
          # diye yazıldı.
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Kod HER ZAMAN main'den gelir; dal sadece veri (status.json, output/ ...)
      # tasir. Aksi halde dal acildigi andaki eski script'lerle calisir, main'e
      # giren duzeltmeler acik kitaplara ulasmaz (ve bir PR'in kendi pr_check.py'sini
      # degistirerek kontrolu zayiflatmasi mumkun olur).
      - name: Use scripts from main
        run: |
          git fetch origin main
          mkdir -p "$RUNNER_TEMP/main-code"
          git archive FETCH_HEAD scripts requirements.txt | tar -x -C "$RUNNER_TEMP/main-code"
          echo "MAIN_CODE=$RUNNER_TEMP/main-code" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r "$MAIN_CODE/requirements.txt"

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run pre-split (and/or nudge queue-worker)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python "$MAIN_CODE/scripts/translate.py"

      # translate.py bu run'da kitabı queue/<slug> dalından book/<slug>'a
      # taşıyor (book dalı queue dalından açılıp push'lanıyor) ama eski
      # queue/<slug> dalını silmiyordu. api/upload.js "queue/ ile başlayan her
      # dal = aktif" sayıyordu, yani her kitaptan sonra yetim bir queue dalı
      # kalıp yeni yüklemeleri engelliyordu — ve sıradaki kitap sistemi
      # onu "bekleyen kitap" sanacaktı. Book dalı gerçekten oluştuktan sonra
      # temizliyoruz.
      - name: Remove spent queue branch
        if: startsWith(github.ref, 'refs/heads/queue/')
        run: |
          slug="${GITHUB_REF_NAME#queue/}"
          if git ls-remote --exit-code --heads origin "book/${slug}" >/dev/null 2>&1; then
            git push origin --delete "${GITHUB_REF_NAME}" \
              || echo "Uyarı: ${GITHUB_REF_NAME} silinemedi (önemli değil)."
          else
            echo "book/${slug} oluşmamış — ${GITHUB_REF_NAME} silinmiyor."
          fi

      # Cron (ya da elle) main'de çalışırken: aktif kitap yoksa ve yüklemesi
      # bitmiş bekleyen bir queue/* dalı varsa en eskisini başlatır. Normal
      # yol delete-merged-book-branch.yml'dir; bu, kaçan tetiklemelerin
      # güvenlik ağı.
      - name: Start next queued book (safety net)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python "$MAIN_CODE/scripts/start_next_queue.py"
