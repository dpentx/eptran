name: Translate Novel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

# translate/review/convert hepsi aynı git durumunu (status.json, output/)
# okuyup yazıyor. Aynı grubu paylaşarak, biri çalışırken diğerinin
# (ya da kendisinin başka bir tetiklemesinin) aynı anda başlayıp git
# push'larda yarışmasını (ve sessizce commit kaybetmesini) engelliyoruz.
# Sadece kendi türünden (başka bir translate run'ı) ile çakışmayı önler.
# ÖNEMLİ: review/convert ile AYNI grubu kullanmıyoruz — aynı grupta
# kuyruğa girmiş birden fazla çalışma olduğunda GitHub Actions sadece
# EN SON kuyruğa gireni çalıştırıp öncekileri iptal ediyor. Bu yüzden
# translate zaman aşımına uğrayıp bir sonraki denemesi kuyruğa girdiğinde,
# review'ın kuyruğa girmiş bir çalışması onu iptal edip yerine geçebiliyordu
# — çevirinin hiç ilerleyememesinin sebebi buydu. Artık her workflow kendi
# grubunda, birbirini kuyruktan atamıyor. Çapraz güvenlik zaten
# status.json kontrolüyle sağlanıyor (review, translate "completed"
# olmadan gerçek işi yapmıyor).
# cancel-in-progress: false -> yeni tetiklenen çalışma öncekini iptal
# etmez, sırasını bekler.
concurrency:
  group: eptran-translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    # Bu adım artık ÇEVİRİ YAPMIYOR, sadece bölüp kuyruğa yazıyor (LLM
    # çağrısı yok) — birkaç dakikadan uzun sürmemeli. Asıl çeviri işini
    # queue-worker.yml, tek parça başına ayrı run'larla yapıyor.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # NOT: explicit belirtiyoruz ama zaten GitHub Actions'ın
          # varsayılanıyla aynı — workflow_dispatch API çağrısında hangi
          # ref (dal) gönderildiyse checkout onu kullanır. Vercel artık
          # bu workflow'u main değil queue/<slug> ref'iyle tetikliyor
          # (bkz. api/upload.js) — bu satır, o davranışın gizli bir
          # varsayıma değil, açık bir tercihe dayandığını belli etsin
          # diye yazıldı.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run pre-split (and/or nudge queue-worker)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/translate.py
