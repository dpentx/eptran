name: Review Translation

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kitap dalı (örn. book/pg2147)"
        required: true
        type: string

concurrency:
  group: eptran-review-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Check review needed
        id: check
        run: |
          python3 - <<'EOF'
          import json, os
          try:
              s = json.load(open("status.json"))
          except Exception:
              s = {}
          needed = s.get("status") == "completed" and s.get("review_status") != "completed"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"needed={'yes' if needed else 'no'}\n")
          EOF

      # Kod HER ZAMAN main'den gelir; dal sadece veri (status.json, output/ ...)
      # tasir. Aksi halde dal acildigi andaki eski script'lerle calisir, main'e
      # giren duzeltmeler acik kitaplara ulasmaz (ve bir PR'in kendi pr_check.py'sini
      # degistirerek kontrolu zayiflatmasi mumkun olur).
      - name: Use scripts from main
        if: steps.check.outputs.needed == 'yes'
        run: |
          git fetch origin main
          mkdir -p "$RUNNER_TEMP/main-code"
          git archive FETCH_HEAD scripts requirements.txt | tar -x -C "$RUNNER_TEMP/main-code"
          echo "MAIN_CODE=$RUNNER_TEMP/main-code" >> "$GITHUB_ENV"

      - name: Setup Python
        if: steps.check.outputs.needed == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.needed == 'yes'
        run: pip install -r "$MAIN_CODE/requirements.txt"

      - name: Configure git
        if: steps.check.outputs.needed == 'yes'
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run review
        if: steps.check.outputs.needed == 'yes'
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python "$MAIN_CODE/scripts/review.py"

      # Review bittiyse (Groq fazi tamam) sıradaki kitabı başlat: kuyruk QA'yı
      # (Gemini kotasına bağlı, saatler/günler sürebilir), ciltlemeyi ve PR
      # merge'ünü BEKLEMEZ. Script idempotent: review henüz bitmediyse ya da
      # başka bir kitap hâlâ çevriliyorsa hiçbir şey yapmaz (bkz.
      # scripts/start_next_queue.py).
      - name: Start next queued book
        if: always() && steps.check.outputs.needed == 'yes'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 "$MAIN_CODE/scripts/start_next_queue.py"
