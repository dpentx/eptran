name: Review Translation

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "İşlenecek kitap dalı (örn. book/pg2147)"
        required: true
        type: string

# translate.yml, hangi kitap dalının review'a hazır olduğunu (status.json
# üzerinden) kendisi tespit edip bu workflow'u dal adıyla tetikliyor —
# artık kendi cron'u ya da workflow_run zincirlemesi yok (geçmişte bu
# ikisinin BİRLİKTE var olması, translate henüz bitmeden review'ın
# gereksiz yere tetiklenmesine yol açmıştı). Merkezi güvenlik ağı
# translate.yml'de; bu workflow sadece açıkça çağrıldığında çalışır.
concurrency:
  group: eptran-review-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Check if review needed
        id: check
        run: |
          STATUS=$(python3 -c "
          import json, sys
          from datetime import datetime, timezone, timedelta
          try:
              with open('status.json') as f:
                  s = json.load(f)
              if s.get('status') != 'completed':
                  print('no')
                  sys.exit()
              rs = s.get('review_status')
              if rs == 'completed':
                  print('no')
                  sys.exit()
              if rs == 'running':
                  updated_at = s.get('updated_at')
                  if not updated_at:
                      print('yes')
                      sys.exit()
                  ts = datetime.fromisoformat(updated_at)
                  if ts.tzinfo is None:
                      ts = ts.replace(tzinfo=timezone.utc)
                  age = datetime.now(timezone.utc) - ts
                  print('yes' if age > timedelta(minutes=30) else 'no')
                  sys.exit()
              print('yes')
          except Exception:
              print('no')
          ")
          echo "needed=$STATUS" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.check.outputs.needed == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.needed == 'yes'
        run: pip install -r requirements.txt

      - name: Configure git
        if: steps.check.outputs.needed == 'yes'
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run review
        if: steps.check.outputs.needed == 'yes'
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/review.py
