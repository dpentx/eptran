name: Review Translation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Translate Novel"]
    types:
      - completed
  schedule:
    - cron: "0 */6 * * *"

# translate.yml ile AYNI grup — ikisi de status.json ve output/ üzerinde
# git push yapıyor. Bu olmadan, translate hâlâ çalışırken (ya da bir
# önceki review hâlâ çalışırken) yeni bir review tetiklenirse, ikisi
# aynı anda push etmeye çalışıp birbirinin commit'ini kaybettirebiliyordu
# (pg2147'deki eksik bölümlerin sebebi buydu). cancel-in-progress: false
# -> devam eden bir review yarıda kesilmez, yeni tetiklenen sıraya girer.
concurrency:
  group: eptran-pipeline
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Check if review needed
        id: check
        run: |
          STATUS=$(python3 -c "
          import json, sys
          from datetime import datetime, timezone, timedelta
          try:
              with open('status.json') as f:
                  s = json.load(f)
              if s.get('status') != 'completed':
                  print('no')
                  sys.exit()
              rs = s.get('review_status')
              if rs == 'completed':
                  print('no')
                  sys.exit()
              if rs == 'running':
                  # stale kontrolü — 30dk+ güncellenmemişse devam et
                  updated_at = s.get('updated_at')
                  if not updated_at:
                      print('yes')
                      sys.exit()
                  ts = datetime.fromisoformat(updated_at)
                  if ts.tzinfo is None:
                      ts = ts.replace(tzinfo=timezone.utc)
                  age = datetime.now(timezone.utc) - ts
                  print('yes' if age > timedelta(minutes=30) else 'no')
                  sys.exit()
              print('yes')
          except Exception:
              print('no')
          ")
          echo "needed=$STATUS" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.check.outputs.needed == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.needed == 'yes'
        run: pip install -r requirements.txt

      - name: Configure git
        if: steps.check.outputs.needed == 'yes'
        run: |
          git config user.name "eptran-bot"
          git config user.email "eptran-bot@users.noreply.github.com"

      - name: Run review
        if: steps.check.outputs.needed == 'yes'
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
        run: python scripts/review.py
