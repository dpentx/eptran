<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eptran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css" />
  <style>
    :root {
      --md-primary: #0ea5e9;
      --md-on-primary: #ffffff;
      --md-primary-container: #cfe9ff;
      --md-on-primary-container: #001a3f;
      
      --md-secondary: #06b6d4;
      --md-on-secondary: #ffffff;
      --md-secondary-container: #b3ebf5;
      --md-on-secondary-container: #001a1f;
      
      --md-tertiary: #8e44ad;
      --md-on-tertiary: #ffffff;
      --md-tertiary-container: #eaddff;
      --md-on-tertiary-container: #33003d;
      
      --md-error: #f87171;
      --md-on-error: #ffffff;
      --md-error-container: #fde2e4;
      --md-on-error-container: #410e0b;
      
      --md-success: #10b981;
      --md-on-success: #ffffff;
      --md-success-container: #d1fae5;
      --md-on-success-container: #022c1f;
      
      --md-surface: #fafafa;
      --md-on-surface: #1a1a1a;
      --md-surface-dim: #ddd9d6;
      --md-surface-bright: #ffffff;
      --md-surface-container-lowest: #ffffff;
      --md-surface-container-low: #f7f2ef;
      --md-surface-container: #f3ede9;
      --md-surface-container-high: #ede7e3;
      --md-surface-container-highest: #e7e1dd;
      
      --md-outline: #79747e;
      --md-outline-variant: #cac4cf;
      --md-scrim: #000000;
      
      --md-shadow: 0 2px 4px rgba(0,0,0,0.12), 0 1px 3px rgba(0,0,0,0.24);
      --md-shadow-md: 0 4px 8px rgba(0,0,0,0.12), 0 2px 4px rgba(0,0,0,0.24);
      --md-shadow-lg: 0 8px 16px rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.12);
      
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #80deea;
        --md-on-primary: #003a52;
        --md-primary-container: #004d6d;
        --md-on-primary-container: #cfe9ff;
        
        --md-secondary: #4dd0e1;
        --md-on-secondary: #003638;
        --md-secondary-container: #004e52;
        --md-on-secondary-container: #b3ebf5;
        
        --md-tertiary: #e6b3ff;
        --md-on-tertiary: #520359;
        --md-tertiary-container: #6e2a7f;
        --md-on-tertiary-container: #eaddff;
        
        --md-error: #ffb4af;
        --md-on-error: #690005;
        --md-error-container: #93000a;
        --md-on-error-container: #ffb4af;
        
        --md-success: #72dd9f;
        --md-on-success: #003828;
        --md-success-container: #0d5c3c;
        --md-on-success-container: #d1fae5;
        
        --md-surface: #1a1a1a;
        --md-on-surface: #e7e1dd;
        --md-surface-dim: #131313;
        --md-surface-bright: #2f2f2f;
        --md-surface-container-lowest: #0e0e0e;
        --md-surface-container-low: #1a1a1a;
        --md-surface-container: #1e1e1e;
        --md-surface-container-high: #2a2a2a;
        --md-surface-container-highest: #353535;
        
        --md-outline: #998fa0;
        --md-outline-variant: #504558;
        --md-scrim: #000000;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--md-surface);
      color: var(--md-on-surface);
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    header {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--md-primary);
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.875rem;
      color: var(--md-outline);
      font-weight: 400;
    }

    .card {
      background: var(--md-surface-container-low);
      border: 1px solid var(--md-outline-variant);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--md-shadow);
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--md-outline);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    #drop-zone {
      border: 2px dashed var(--md-outline-variant);
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      background: var(--md-surface-container);
    }

    #drop-zone:hover {
      border-color: var(--md-primary);
      background: var(--md-primary-container);
    }

    #drop-zone.drag-over {
      border-color: var(--md-primary);
      background: var(--md-primary-container);
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    #drop-zone .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      display: block;
      opacity: 0.8;
    }

    #drop-zone .label {
      font-size: 0.95rem;
      color: var(--md-on-surface);
      line-height: 1.5;
    }

    #drop-zone .label strong {
      color: var(--md-primary);
      font-weight: 500;
    }

    #file-info {
      display: none;
      margin-top: 1.2rem;
      padding: 0.75rem 1rem;
      background: var(--md-secondary-container);
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--md-on-secondary-container);
      align-items: center;
      gap: 0.75rem;
    }

    #file-info.hidden {
      display: none !important;
    }

    #file-info:not(.hidden) {
      display: flex;
    }

    #file-info i {
      font-size: 1.25rem;
    }

    #feedback-box {
      display: none;
      margin-top: 1.2rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.3s ease;
    }

    #feedback-box.visible {
      display: flex;
    }

    #feedback-box.uploading {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border: 1px solid rgba(16, 149, 233, 0.2);
    }

    #feedback-box.error {
      background: var(--md-error-container);
      color: var(--md-on-error-container);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    #feedback-box.translating {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border: 1px solid rgba(16, 149, 233, 0.2);
    }

    #feedback-box.completed {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    #feedback-box i {
      flex-shrink: 0;
      font-size: 1.25rem;
    }

    #feedback-box .feedback-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    #feedback-box .feedback-text {
      flex: 1;
    }

    #feedback-box .feedback-progress {
      flex-shrink: 0;
      min-width: 60px;
      text-align: right;
      font-size: 0.75rem;
      opacity: 0.9;
    }

    #feedback-progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.5rem;
      display: none;
    }

    #feedback-progress-bar.visible {
      display: block;
    }

    #feedback-progress-fill {
      height: 100%;
      background: currentColor;
      border-radius: 2px;
      transition: width 0.8s ease;
      width: 0%;
      opacity: 0.8;
    }

    #feedback-box.uploading #feedback-progress-bar,
    #feedback-box.translating #feedback-progress-bar {
      display: block;
    }

    #submit-btn {
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--md-primary);
      color: var(--md-on-primary);
      border: none;
      border-radius: 8px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      box-shadow: var(--md-shadow);
      text-transform: uppercase;
    }

    #submit-btn:hover:not(:disabled) {
      box-shadow: var(--md-shadow-md);
      transform: translateY(-2px);
    }

    #submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    #submit-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    #status-card {
      display: none;
    }

    #status-card.visible {
      display: block;
    }

    #review-card {
      display: none;
    }

    #review-card.visible {
      display: block;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .progress-book {
      font-size: 1rem;
      color: var(--md-on-surface);
      font-weight: 500;
    }

    .progress-count {
      font-size: 0.8125rem;
      color: var(--md-outline);
      font-weight: 400;
    }

    .progress-bar-track {
      height: 4px;
      background: var(--md-outline-variant);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress-chapter {
      font-size: 0.8125rem;
      color: var(--md-outline);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 400;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.75rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.875rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .badge-idle {
      background: var(--md-outline-variant);
      color: var(--md-outline);
    }

    .badge-running {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
    }

    .badge-completed {
      background: var(--md-success-container);
      color: var(--md-on-success-container);
    }

    .badge-converting {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    .badge-reviewing {
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
    }

    .badge-running i, .badge-converting i, .badge-reviewing i {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #output-section {
      display: none;
    }

    #output-section.visible {
      display: block;
    }

    .epub-download {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: var(--md-success-container);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    .epub-download span {
      font-size: 0.9375rem;
      color: var(--md-on-success-container);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .epub-download a {
      padding: 0.5rem 1rem;
      background: var(--md-success);
      color: var(--md-on-success);
      border-radius: 6px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: var(--md-shadow);
    }

    .epub-download a:hover {
      box-shadow: var(--md-shadow-md);
      transform: translateY(-1px);
    }

    .epub-converting {
      padding: 1rem;
      background: var(--md-secondary-container);
      border: 1px dashed rgba(77, 208, 225, 0.3);
      border-radius: 12px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      color: var(--md-on-secondary-container);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .epub-converting i {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .output-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .output-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline-variant);
      border-radius: 8px;
      font-size: 0.8125rem;
      color: var(--md-on-surface);
      transition: all 0.2s ease;
    }

    .output-item:hover {
      background: var(--md-surface-container-high);
      border-color: var(--md-outline);
    }

    .output-item i {
      margin-right: 0.5rem;
      color: var(--md-primary);
    }

    .output-item a {
      color: var(--md-primary);
      text-decoration: none;
      font-weight: 500;
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .output-item a:hover {
      background: var(--md-primary-container);
    }

    #error-msg {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: var(--md-error-container);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 8px;
      font-size: 0.8125rem;
      color: var(--md-on-error-container);
      font-weight: 400;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    #error-msg.visible {
      display: flex;
    }

    #error-msg i {
      margin-top: 2px;
      flex-shrink: 0;
    }

    .updated-at {
      font-size: 0.75rem;
      color: var(--md-outline);
      margin-top: 0.75rem;
      text-align: right;
      font-weight: 400;
    }

    footer {
      margin-top: auto;
      padding-top: 2rem;
      font-size: 0.75rem;
      color: var(--md-outline);
      text-align: center;
    }

    footer a {
      color: var(--md-primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: var(--md-secondary);
    }

    @media (max-width: 640px) {
      body {
        padding: 1.5rem 1rem;
      }

      header {
        margin-bottom: 2rem;
      }

      header h1 {
        font-size: 1.625rem;
      }

      .card {
        padding: 1.25rem;
        max-width: 100%;
      }

      #drop-zone {
        padding: 2rem 1rem;
      }

      .status-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>eptran</h1>
  <p>epub → türkçe çeviri</p>
</header>

<div class="card" id="upload-card">
  <div class="card-title">kitap yükle</div>

  <div id="drop-zone">
    <input type="file" id="file-input" accept=".epub,.pdf" />
    <span class="icon">📖</span>
    <div class="label">
      <strong>epub veya pdf seç</strong><br>
      ya da sürükle bırak
    </div>
  </div>

  <div id="file-info" class="hidden">
    <i class="ti ti-file"></i>
    <span id="file-name-label"></span>
  </div>

  <div id="feedback-box">
    <i class="ti ti-info-circle"></i>
    <div class="feedback-content">
      <div class="feedback-text" id="feedback-text"></div>
      <div class="feedback-progress" id="feedback-progress"></div>
    </div>
    <div id="feedback-progress-bar" class="visible">
      <div id="feedback-progress-fill"></div>
    </div>
  </div>

  <button id="submit-btn" disabled>Çeviriyi Başlat</button>
</div>

<div class="card" id="status-card">
  <div class="card-title">çeviri durumu</div>

  <div class="status-row">
    <div class="progress-book" id="status-book">—</div>
    <span class="status-badge badge-idle" id="status-badge">
      <i class="ti ti-clock"></i> bekliyor
    </span>
  </div>

  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div class="progress-header">
    <div class="progress-chapter" id="status-chapter">—</div>
    <div class="progress-count" id="status-count">0 / 0</div>
  </div>

  <div class="updated-at" id="updated-at"></div>
</div>

<div class="card" id="review-card">
  <div class="card-title">inceleme durumu</div>

  <div class="status-row">
    <div class="progress-book" id="review-book">—</div>
    <span class="status-badge badge-idle" id="review-badge">
      <i class="ti ti-clock"></i> bekliyor
    </span>
  </div>

  <div class="progress-bar-track">
    <div class="progress-bar-fill" id="review-fill"></div>
  </div>

  <div class="progress-header">
    <div class="progress-chapter" id="review-file">—</div>
    <div class="progress-count" id="review-count">0 / 0</div>
  </div>
</div>

<div class="card" id="output-section">
  <div class="card-title">çıktı dosyaları</div>
  <div id="epub-area"></div>
  <div class="output-list" id="output-list"></div>
</div>

<footer>
  <a href="https://github.com/search?q=eptran" target="_blank">github</a>
  &nbsp;·&nbsp;
  <a href="#" onclick="event.preventDefault()">groq gpt-oss-120b</a>
</footer>

<script>
  const dropZone    = document.getElementById('drop-zone');
  const fileInput   = document.getElementById('file-input');
  const fileInfo    = document.getElementById('file-info');
  const fileNameLabel = document.getElementById('file-name-label');
  const submitBtn   = document.getElementById('submit-btn');
  const feedbackBox = document.getElementById('feedback-box');
  const feedbackText = document.getElementById('feedback-text');
  const feedbackProgress = document.getElementById('feedback-progress');
  const feedbackProgressFill = document.getElementById('feedback-progress-fill');
  const statusCard  = document.getElementById('status-card');
  const outputSection = document.getElementById('output-section');

  let selectedFile = null;
  let pollInterval = null;

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    if (!file.name.endsWith('.epub') && !file.name.endsWith('.pdf')) {
      showFeedback('Sadece .epub ve .pdf dosyaları destekleniyor.', 'error');
      return;
    }
    selectedFile = file;
    fileNameLabel.textContent = file.name;
    fileInfo.classList.remove('hidden');
    submitBtn.disabled = false;
    hideFeedback();
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    submitBtn.disabled = true;
    hideFeedback();

    try {
      showFeedback('Hazırlanıyor...', 'uploading');
      const credsRes = await fetch('/api/creds');
      if (!credsRes.ok) throw new Error('Credentials alınamadı');
      const { repo, branch, pat } = await credsRes.json();

      showFeedback('Dosya okunuyor...', 'uploading');
      const base64 = await toBase64(selectedFile);

      showFeedback('GitHub bilgileri sorgulanıyor...', 'uploading');

      let existingSha;
      const checkRes = await fetch(
        `https://api.github.com/repos/${repo}/contents/input/${selectedFile.name}`,
        { headers: { Authorization: `token ${pat}` } }
      );
      if (checkRes.ok) {
        const existing = await checkRes.json();
        existingSha = existing.sha;
      }

      const commitBody = {
        message: `upload: ${selectedFile.name}`,
        content: base64,
        branch,
      };
      if (existingSha) commitBody.sha = existingSha;

      const commitData = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', `https://api.github.com/repos/${repo}/contents/input/${selectedFile.name}`);
        xhr.setRequestHeader('Authorization', `token ${pat}`);
        xhr.setRequestHeader('Content-Type', 'application/json');

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            feedbackProgressFill.style.width = percent + '%';
            feedbackProgress.textContent = `%${percent}`;
            showFeedback(`GitHub'a yükleniyor...`, 'uploading', true);
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              resolve(JSON.parse(xhr.responseText));
            } catch {
              resolve(xhr.responseText);
            }
          } else {
            try {
              const err = JSON.parse(xhr.responseText);
              reject(new Error(err.message || 'GitHub yükleme başarısız'));
            } catch {
              reject(new Error(`GitHub yükleme başarısız (Kod: ${xhr.status})`));
            }
          }
        };

        xhr.onerror = () => reject(new Error('Ağ hatası oluştu.'));
        xhr.send(JSON.stringify(commitBody));
      });

      showFeedback('Çeviri başlatılıyor...', 'translating');
      const triggerRes = await fetch('/api/trigger', { method: 'POST' });
      const triggerData = await triggerRes.json();
      if (!triggerRes.ok) {
        throw new Error(triggerData.error || 'Workflow tetiklenemedi');
      }

      showFeedback('Çeviri başladı ✓', 'completed');
      setTimeout(() => startPolling(), 500);
    } catch (err) {
      showFeedback('Hata: ' + err.message, 'error');
      submitBtn.disabled = false;
    }
  });

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = () => reject(new Error('Dosya okunamadı'));
      reader.readAsDataURL(file);
    });
  }

  function startPolling() {
    statusCard.classList.add('visible');
    fetchStatus();
    pollInterval = setInterval(fetchStatus, 10000);
  }

  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      updateStatusUI(data);

      const done = data.status === 'completed' && (data.epubFile || data.convert_status === 'completed');
      const idle = data.status === 'idle';
      if (done || idle) clearInterval(pollInterval);
    } catch (err) {
      console.error('Status fetch error:', err);
    }
  }

  function updateStatusUI(data) {
    const badge     = document.getElementById('status-badge');
    const bookEl    = document.getElementById('status-book');
    const chapterEl = document.getElementById('status-chapter');
    const countEl   = document.getElementById('status-count');
    const fill      = document.getElementById('progress-fill');
    const updatedAt = document.getElementById('updated-at');
    const epubArea  = document.getElementById('epub-area');

    badge.className = 'status-badge';

    if (data.status === 'running') {
      badge.classList.add('badge-running');
      badge.innerHTML = '<i class="ti ti-circle-check-filled"></i> çalışıyor';
    } else if (data.status === 'completed' && data.convert_status === 'running') {
      badge.classList.add('badge-converting');
      badge.innerHTML = '<i class="ti ti-book"></i> epub oluşturuluyor';
    } else if (data.status === 'completed') {
      badge.classList.add('badge-completed');
      badge.innerHTML = '<i class="ti ti-check"></i> tamamlandı';
    } else {
      badge.classList.add('badge-idle');
      badge.innerHTML = '<i class="ti ti-clock"></i> bekliyor';
    }

    if (data.book) bookEl.textContent = data.book.replace(/_/g, ' ');
    if (data.current_chapter) chapterEl.textContent = '→ ' + data.current_chapter;

    const total = data.total || 0;
    const completed = data.completed || 0;
    countEl.textContent = `${completed} / ${total}`;
    fill.style.width = total > 0 ? `${(completed / total) * 100}%` : '0%';

    if (data.updated_at) {
      const d = new Date(data.updated_at);
      updatedAt.textContent = 'güncellendi: ' + d.toLocaleString('tr-TR');
    }

    if (data.epubFile || (data.outputFiles && data.outputFiles.length > 0) || data.convert_status === 'running') {
      outputSection.classList.add('visible');
    }

    if (data.epubFile) {
      epubArea.innerHTML = `
        <div class="epub-download">
          <span><i class="ti ti-book"></i> ${data.epubFile.name}</span>
          <a href="${data.epubFile.download_url}" target="_blank">İndir</a>
        </div>`;
    } else if (data.status === 'completed' && data.convert_status === 'running') {
      epubArea.innerHTML = `<div class="epub-converting"><i class="ti ti-loader"></i> epub oluşturuluyor...</div>`;
    } else if (data.status === 'completed' && !data.epubFile) {
      epubArea.innerHTML = `<div class="epub-converting"><i class="ti ti-hourglass-empty"></i> epub bekleniyor...</div>`;
    } else {
      epubArea.innerHTML = '';
    }

    if (data.outputFiles && data.outputFiles.length > 0) {
      const list = document.getElementById('output-list');
      list.innerHTML = data.outputFiles
        .map(f => `
          <div class="output-item">
            <span><i class="ti ti-file-document"></i> ${f.name}</span>
            <a href="${f.download_url}" target="_blank">İndir</a>
          </div>`)
        .join('');
    }

    updateReviewUI(data);
  }

  function updateReviewUI(data) {
    const reviewCard  = document.getElementById('review-card');
    const badge       = document.getElementById('review-badge');
    const bookEl      = document.getElementById('review-book');
    const fileEl      = document.getElementById('review-file');
    const countEl     = document.getElementById('review-count');
    const fill        = document.getElementById('review-fill');

    // İnceleme, çeviri tamamlanmadan başlamıyor — review_status hiç
    // yoksa (henüz sıra gelmemiş) kartı hiç gösterme.
    if (!data.review_status) {
      reviewCard.classList.remove('visible');
      return;
    }
    reviewCard.classList.add('visible');

    badge.className = 'status-badge';
    if (data.review_status === 'running') {
      badge.classList.add('badge-reviewing');
      badge.innerHTML = '<i class="ti ti-eye-check"></i> inceleniyor';
    } else if (data.review_status === 'completed') {
      badge.classList.add('badge-completed');
      badge.innerHTML = '<i class="ti ti-check"></i> tamamlandı';
    } else {
      badge.classList.add('badge-idle');
      badge.innerHTML = '<i class="ti ti-clock"></i> bekliyor';
    }

    if (data.book) bookEl.textContent = data.book.replace(/_/g, ' ');
    if (data.review_current) fileEl.textContent = '→ ' + data.review_current;

    const total = data.review_total || 0;
    const completed = data.review_completed || 0;
    countEl.textContent = `${completed} / ${total}`;
    fill.style.width = total > 0 ? `${(completed / total) * 100}%` : '0%';
  }

  function showFeedback(msg, state = 'uploading', keepProgress = false) {
    feedbackBox.className = `visible ${state}`;
    
    let icon = 'ti-info-circle';
    if (state === 'error') icon = 'ti-alert-circle';
    else if (state === 'uploading') icon = 'ti-upload';
    else if (state === 'translating') icon = 'ti-circle-check-filled';
    else if (state === 'completed') icon = 'ti-check';
    
    feedbackBox.querySelector('i').className = `ti ${icon}`;
    feedbackText.textContent = msg;
    
    if (!keepProgress) {
      feedbackProgress.textContent = '';
      feedbackProgressFill.style.width = '0%';
    }
  }

  function hideFeedback() {
    feedbackBox.classList.remove('visible');
  }

  window.addEventListener('load', async () => {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      if (data.status === 'running' || data.status === 'completed') {
        statusCard.classList.add('visible');
        updateStatusUI(data);
        if (data.status === 'running' || data.convert_status === 'running') {
          submitBtn.textContent = 'Çeviri Devam Ediyor';
          submitBtn.disabled = true;
          startPolling();
        }
      }
    } catch (_) {}
  });
</script>
</body>
</html>
